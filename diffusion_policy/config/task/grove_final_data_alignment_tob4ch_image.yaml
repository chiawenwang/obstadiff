name: grove_final_data_alignment_tob4ch_image

# Expected layout:
#   data/final_data_decomp/demo_decomp_*/head_camera_cam4.npy
#   data/final_data_decomp/demo_decomp_*/robot_states.npy
#   data/final_data_decomp/demo_decomp_*/alignment_end_idx.npy
dataset_path: data/final_data_decomp
image_shape: [4, 240, 320]

shape_meta: &shape_meta
  obs:
    cam_high:
      shape: ${task.image_shape}
      type: rgb
    eef_pose:
      shape: [7]
      type: low_dim
  action:
    shape: [7]

env_runner:
  _target_: diffusion_policy.env_runner.grove_sawyer_image_runner.GroveSawyerImageRunner

dataset:
  _target_: diffusion_policy.dataset.grove_final_data_image_dataset.GroveFinalDataImageDataset
  shape_meta: *shape_meta
  dataset_path: ${task.dataset_path}
  horizon: ${horizon}
  pad_before: ${eval:'${n_obs_steps}-1+${n_latency_steps}'}
  pad_after: ${eval:'${n_action_steps}-1'}
  n_obs_steps: ${dataset_obs_steps}
  n_latency_steps: ${n_latency_steps}
  use_cache: True
  seed: 42
  val_ratio: 0.1
  max_train_episodes: null
  max_episodes: null
  episode_prefix: demo_decomp_
  image_mode: cam4
  cam4_file: head_camera_cam4.npy
  robot_states_file: robot_states.npy
  eef_slice: [7, 14]
  alignment_only: True
  alignment_end_file: alignment_end_idx.npy
